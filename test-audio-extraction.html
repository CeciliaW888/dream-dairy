<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Extraction Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a2e;
      color: white;
    }
    .test-box {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,255,0,0.1);
      border-left: 4px solid #00ff00;
      border-radius: 4px;
    }
    .error {
      background: rgba(255,0,0,0.1);
      border-left: 4px solid #ff0000;
    }
    audio {
      width: 100%;
      margin: 15px 0;
    }
    .log {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }
    .log-entry {
      margin: 5px 0;
      padding: 3px 0;
    }
  </style>
</head>
<body>
  <h1>🎙️ Audio Extraction Test</h1>
  <p>Testing the new MediaRecorder-based audio extraction</p>

  <div class="test-box">
    <h3>Test Video: IMG_9367.MOV</h3>
    <input type="file" id="fileInput" accept="video/*,audio/*" />
    <button onclick="testExtraction()">Extract Audio</button>
    <button onclick="clearResults()">Clear</button>
    
    <div id="progress" style="display:none;">
      <div class="progress">
        <div class="progress-fill" id="progressBar" style="width: 0%"></div>
      </div>
      <p id="progressText">0%</p>
    </div>

    <div id="results"></div>
  </div>

  <div class="log" id="log"></div>

  <script type="module">
    // Import the audio extractor
    import { extractAudioFromVideo, getAudioDuration, formatDuration } from './src/lib/audioExtractor.js';

    let extractedBlob = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const timestamp = new Date().toLocaleTimeString();
      entry.innerHTML = `<span style="color: #888">[${timestamp}]</span> ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    window.testExtraction = async function() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Please select a video or audio file first!');
        return;
      }

      const resultsDiv = document.getElementById('results');
      const progressDiv = document.getElementById('progress');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      resultsDiv.innerHTML = '';
      progressDiv.style.display = 'block';
      progressBar.style.width = '0%';
      progressText.textContent = '0%';

      log(`📁 File selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);
      log(`📋 File type: ${file.type || 'unknown'}`);

      const startTime = Date.now();

      try {
        log('🚀 Starting audio extraction...');
        
        // Test the extraction
        const audioBlob = await extractAudioFromVideo(file, (progress) => {
          progressBar.style.width = `${progress}%`;
          progressText.textContent = `${progress}%`;
          log(`⏳ Progress: ${progress}%`);
        });

        const endTime = Date.now();
        const duration = ((endTime - startTime) / 1000).toFixed(2);

        log(`✅ Extraction complete in ${duration}s`);
        log(`📊 Audio blob size: ${(audioBlob.size / 1024 / 1024).toFixed(2)} MB`);
        log(`📋 Audio type: ${audioBlob.type}`);

        // Get audio duration
        const audioDuration = await getAudioDuration(audioBlob);
        log(`⏱️ Audio duration: ${formatDuration(audioDuration)} (${audioDuration.toFixed(2)}s)`);

        extractedBlob = audioBlob;

        // Display results
        resultsDiv.innerHTML = `
          <div class="result">
            <h4>✅ Success!</h4>
            <p><strong>File:</strong> ${file.name}</p>
            <p><strong>Input Size:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
            <p><strong>Output Size:</strong> ${(audioBlob.size / 1024 / 1024).toFixed(2)} MB</p>
            <p><strong>Format:</strong> ${audioBlob.type}</p>
            <p><strong>Duration:</strong> ${formatDuration(audioDuration)}</p>
            <p><strong>Extraction Time:</strong> ${duration}s</p>
            <audio controls src="${URL.createObjectURL(audioBlob)}"></audio>
            <br>
            <button onclick="downloadAudio()">Download Audio</button>
          </div>
        `;

        log('🎵 Audio ready to play!');

      } catch (error) {
        log(`❌ Error: ${error.message}`, 'error');
        console.error(error);
        
        resultsDiv.innerHTML = `
          <div class="result error">
            <h4>❌ Extraction Failed</h4>
            <p><strong>Error:</strong> ${error.message}</p>
            <pre>${error.stack}</pre>
          </div>
        `;
      } finally {
        progressDiv.style.display = 'none';
      }
    };

    window.downloadAudio = function() {
      if (!extractedBlob) return;
      
      const url = URL.createObjectURL(extractedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'extracted-audio.' + (extractedBlob.type.includes('webm') ? 'webm' : 'mp3');
      a.click();
      URL.revokeObjectURL(url);
      
      log('💾 Audio download started');
    };

    window.clearResults = function() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('log').innerHTML = '';
      document.getElementById('fileInput').value = '';
      extractedBlob = null;
      log('🧹 Cleared');
    };

    // Initial log
    log('🎯 Audio Extraction Test Ready');
    log('👉 Select a video file and click "Extract Audio"');
  </script>
</body>
</html>
